# Keep the pins current. A submodule bump (openverse/ or demo/) is a pull request
# whose CI re-checks every program and Lean statement of the books against the new
# openverse and rebuilds and browser-tests the playground; merge it when it is green.
# Action updates come grouped (one pull request a week); each submodule bump is its own.
version: 2
updates:
  - package-ecosystem: gitsubmodule
    directory: /
    schedule:
      interval: daily
  - package-ecosystem: github-actions
    directory: /
    schedule:
      interval: weekly
    groups:
      actions:
        patterns: ["*"]
